camera:
  index: 0
  width: 640
  height: 480
  fps: 30
  image_extension: .jpg
  jpeg_quality: 95

paths:
  raw: dataset/raw
  metadata: dataset/metadata/dataset_metadata.csv

hsv:
  # Brown test liquid on the white background. OpenCV HSV ranges:
  # H=0..179, S=0..255, V=0..255.
  lower: [10, 45, 80]
  upper: [35, 255, 230]

morphology:
  kernel_size: 3
  open_iterations: 1
  close_iterations: 1
  min_component_pixels: 20
  fill_holes: true

capture:
  default_lighting_condition: normal
  default_liquid_concentration: standard
